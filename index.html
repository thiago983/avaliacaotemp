<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Avaliação por valores</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2430; --muted:#5d6877; --line:#d9dee5;
  --navy:#1f3a5f; --navy-ink:#ffffff; --sel:#ffe9a8; --sel-line:#d9a900; --sel-ink:#3d2f00;
  --fraco:#f8dede; --fraco-ink:#7a2222; --basico:#fff1cc; --basico-ink:#6b4e00;
  --chg:#0f6b5c; --focus:#2f6fdb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --surface:#1b222b; --ink:#e8ecf1; --muted:#9aa5b4; --line:#2c3643;
    --navy:#8fb2e6; --navy-ink:#10243f; --sel:#4a3d0c; --sel-line:#d9b53a; --sel-ink:#ffe9a8;
    --fraco:#3b2020; --fraco-ink:#f0b4b4; --basico:#33290d; --basico-ink:#f1d98b; --chg:#59d1bb; --focus:#7fb0ff;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b222b; --ink:#e8ecf1; --muted:#9aa5b4; --line:#2c3643;
  --navy:#8fb2e6; --navy-ink:#10243f; --sel:#4a3d0c; --sel-line:#d9b53a; --sel-ink:#ffe9a8;
  --fraco:#3b2020; --fraco-ink:#f0b4b4; --basico:#33290d; --basico-ink:#f1d98b; --chg:#59d1bb; --focus:#7fb0ff;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
.row1{display:flex;gap:8px;align-items:center}
.row1 select,.row1 #who2{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}
.nav{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:44px;height:44px;cursor:pointer;font-size:18px}
.nav:disabled{opacity:.35;cursor:default}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;align-items:center}
.stats b{color:var(--ink)}
.chg-n{color:var(--chg);font-weight:600}
.bartrack{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.barfill{height:100%;background:var(--navy);width:0;transition:width .2s}
main{max-width:820px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:22px;margin:4px 0 2px;color:var(--navy)}
.cargo{color:var(--muted);margin:0 0 12px}
details.ctx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
details.ctx summary{cursor:pointer;font-weight:600}
details.ctx p{margin:8px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy)}
.toast{color:var(--chg);font-size:14px;align-self:center}
section.val{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
section.val h2{margin:0;padding:10px 14px;background:var(--navy);color:var(--navy-ink);font-size:15px;letter-spacing:.02em}
.grp{padding:6px 14px;font-weight:700;font-size:14px}
.grp.f{background:var(--fraco);color:var(--fraco-ink)}
.grp.b{background:var(--basico);color:var(--basico-ink)}
.q{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
@media(min-width:640px){.q{grid-template-columns:1fr auto;align-items:center;gap:16px}}
.q .t{max-width:46ch}
.opts{display:grid;grid-template-columns:76px 76px 130px 96px;gap:6px;justify-content:start}
@media(max-width:480px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;user-select:none;min-height:40px;background:var(--surface)}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--navy);cursor:pointer;flex:none}
.opt.on{background:var(--sel);border-color:var(--sel-line);color:var(--sel-ink);font-weight:600}
.q .mark{font-size:12px;color:var(--chg);font-weight:600;display:none}
.q.changed .mark{display:block}
.base{padding:9px 14px;border-top:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:14px}
.base b{color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--muted)}

.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who .lbl{font-size:14px;color:var(--muted);margin-right:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.sync{font-size:13px;color:var(--muted)}
.ana{margin:10px 0 0}
.ana h3{margin:0 0 4px;font-size:15px;color:var(--navy)}
.ana textarea{width:100%;min-height:130px;padding:10px 12px;border:1px solid var(--sel-line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.ana .ro{white-space:pre-wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--ink)}
.ana .ro.none{color:var(--muted)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center}
.welcome h1{margin:0 0 6px}
.welcome p{color:var(--muted);margin:0 0 14px}
.welcome .seg{justify-content:center}
.note{background:var(--basico);color:var(--basico-ink);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.cmp{display:grid;gap:6px}
@media(min-width:640px){.cmp{grid-template-columns:repeat(3,minmax(88px,1fr));min-width:330px}}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;background:var(--surface)}
.chip span:first-child{color:var(--muted)}
.chip.empty span:last-child{color:var(--muted)}
.chip.has{background:var(--sel);border-color:var(--sel-line);color:var(--sel-ink)}
.q.div{box-shadow:inset 4px 0 0 var(--chg)}
.q .divtag{font-size:12px;color:var(--chg);font-weight:600}
body.locked header,body.locked main{display:none}
#gate{max-width:420px;margin:12vh auto 0;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
#gate h1{margin:0 0 6px;font-size:22px;color:var(--navy)}
#gate p{color:var(--muted);margin:0 0 14px}
#gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
#gate .btn{width:100%;background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
#gerr{color:#b3261e;min-height:1.4em;margin:8px 0 0;font-size:14px}

@media screen{#report{display:none}}
@page{size:A4;margin:14mm}
@media print{
  body>*:not(#report){display:none!important}
  html,body{background:#fff!important}
  #report{display:block;color:#111;background:#fff;font:10pt/1.4 Calibri,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report h1{font-size:18pt;color:#1f3a5f;margin:0 0 2pt}
  #report h2{font-size:11pt;color:#2e5c8a;margin:10pt 0 3pt}
  #report .rp-sub{color:#555;margin-bottom:4pt}
  #report .rp-meta{font-size:9.5pt;color:#333;margin:2pt 0 6pt;padding-bottom:4pt;border-bottom:1px solid #bbb}
  #report .rp-ana{white-space:pre-wrap;border:1px solid #ccc;border-radius:4px;padding:5pt 7pt}
  #report .rp-ana.none{color:#777;font-style:italic}
  #report .rp-agent{page-break-before:always}
  #report .rp-agent:first-child{page-break-before:auto}
  #report table{width:100%;border-collapse:collapse;margin:8pt 0;page-break-inside:avoid;table-layout:fixed}
  #report th{background:#1f3a5f;color:#fff;text-align:left;padding:3pt 5pt;font-size:9pt}
  #report td{border:1px solid #bbb;padding:3pt 5pt;vertical-align:top;font-size:9.5pt}
  #report th:first-child,#report td:first-child{width:49%}
  #report tr{page-break-inside:avoid}
  #report .grp td{background:#eee;font-weight:bold;font-size:9pt}
  #report tr.div td{background:#e0f1ed}
  #report td.has{background:#ffe9a8}
  #report tr.div td:first-child{border-left:3px solid #0f6b5c}
  #report .rp-small{font-size:9pt;color:#444}
  #report .num{text-align:center}
}
</style>
</head>
<body class="locked">
<div id="gate"><h1>Avaliação por valores</h1><p>Digite a senha enviada pelo Thiago para abrir.</p>
<form id="gform"><input id="gpass" type="password" autocomplete="current-password" aria-label="Senha" autofocus><button class="btn" type="submit">Abrir</button></form><div id="gerr" role="alert"></div></div>
<header>
  <div class="bar">
    <div class="who"><span class="lbl">Quem está votando</span>
      <div class="seg" id="voters"></div></div>
    <div class="row1">
      <button class="nav" id="prev" aria-label="Pessoa anterior">‹</button>
      <select id="who2" aria-label="Escolher pessoa"></select>
      <button class="nav" id="next" aria-label="Próxima pessoa">›</button>
    </div>
    <div class="stats"><span id="statmain"></span><span class="chg-n" id="chg"></span><span class="sync" id="sync" role="status"></span></div>
    <div class="bartrack"><div class="barfill" id="fill"></div></div>
  </div>
</header>
<main id="main"></main>
<script src="config.js"></script>

function getAns(v, p){
  const s = state.votes[v].ans && state.votes[v].ans[p.nome];
  if (s && s.length === 36) return s.split("").map(c => c === "-" ? "" : c);
  return v === "thiago" ? sugg(p) : Array(36).fill("");
}
function putAns(v, p, arr){
  const o = state.votes[v]; o.ans = o.ans || {};
  o.ans[p.nome] = arr.map(c => c || "-").join(""); o._t = Date.now();
}
function getAna(v, p){
  const t = state.votes[v].ana && state.votes[v].ana[p.nome];
  if (typeof t === "string") return t;
  return v === "thiago" ? defaultAna(p) : "";
}
function putAna(v, p, text){
  const o = state.votes[v]; o.ana = o.ana || {}; o.ana[p.nome] = text; o._t = Date.now();
}

/* ---------- salvar ---------- */
function setSync(t){ $("sync").textContent = t; }
function persistLocal(){
  try { localStorage.setItem(LS_VOTES, JSON.stringify(state.votes)); setSync("Salvo neste navegador"); }
  catch(e){ setSync("Não foi possível salvar neste navegador."); }
}
function scheduleSave(v){ setSync("Salvando…"); clearTimeout(timers.t); timers.t = setTimeout(()=>{ persistLocal(); }, 400); pushLater(v); }

/* ---------- sincronização compartilhada (Google Apps Script) ---------- */
const SYNC = (typeof window.SYNC_URL === "string" && /^https:\/\//.test(window.SYNC_URL)) ? window.SYNC_URL : "";
let PASS = "", VKEY = null, remoteOK = false;
const toB64 = u8 => { let s = ""; for (let i=0;i<u8.length;i+=8192) s += String.fromCharCode.apply(null, u8.subarray(i,i+8192)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function votesKey(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt: enc.encode("votos|" + ENC.salt), iterations: 300000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function sealVotes(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, VKEY, new TextEncoder().encode(JSON.stringify(obj))));
  return toB64(iv) + "." + toB64(ct);
}
async function openVotes(blob){
  const [iv, ct] = blob.split(".");
  const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv: fromB64(iv) }, VKEY, fromB64(ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function http(method, body){
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 12000);
  try {
    const url = method === "GET" ? SYNC + (SYNC.includes("?") ? "&" : "?") + "t=" + Date.now() : SYNC;
    const r = await fetch(url, method === "GET" ? { signal: ctl.signal } : { method:"POST", body: JSON.stringify(body), signal: ctl.signal, redirect:"follow" });
    return await r.json();
  } finally { clearTimeout(to); }
}
const pushTimers = {};
function pushLater(v){
  if (!SYNC) return;
  dirty[v] = true; clearTimeout(pushTimers[v]);
  pushTimers[v] = setTimeout(()=>pushNow(v), 1200);
}
async function pushNow(v){
  if (!SYNC || !VKEY) return;
  if (!remoteOK) { setSync("Sem conexão com o servidor. Salvo neste navegador."); pushTimers[v] = setTimeout(()=>pushNow(v), 15000); return; }
  if (saving[v]) { again[v] = true; return; }
  saving[v] = true;
  try {
    do {
      again[v] = false;
      const r = await http("POST", { voter: v, blob: await sealVotes(state.votes[v]) });
      if (!r || !r.ok) throw 0;
    } while (again[v]);
    dirty[v] = false; setSync("Salvo e compartilhado com os outros líderes");
  } catch(e) {
    setSync("Não deu para enviar ao servidor. Salvo neste navegador, tentando de novo.");
    pushTimers[v] = setTimeout(()=>pushNow(v), 15000);
  } finally { saving[v] = false; }
}
async function pullAll(){
  if (!SYNC || !VKEY) return false;
  let data;
  try { data = await http("GET"); } catch(e) { remoteOK = false; setSync("Sem conexão com o servidor. Votos salvos neste navegador."); return false; }
  if (!data || typeof data !== "object") { remoteOK = false; setSync("Servidor de votos indisponível. Votos salvos neste navegador."); return false; }
  remoteOK = true;
  const changed = [];
  for (const [id] of VOTERS) {
    const blob = data[id];
    const loc = state.votes[id] || {};
    if (!blob) { if (loc._t) pushLater(id); continue; }
    if (dirty[id] || saving[id]) continue;
    try {
      const rem = await openVotes(blob);
      if ((rem._t || 0) > (loc._t || 0)) { state.votes[id] = rem; changed.push(id); }
      else if ((rem._t || 0) < (loc._t || 0)) pushLater(id);
    } catch(e) {}
  }
  if (changed.length) { try { localStorage.setItem(LS_VOTES, JSON.stringify(state.votes)); } catch(e){} }
  if (!Object.keys(dirty).some(k=>dirty[k])) setSync("Votos compartilhados e atualizados");
  return changed;
}
function afterRemote(ch){
  if (!ready || !ch || !ch.length) return;
  const ae = document.activeElement, y = window.scrollY;
  if (mode === "compare" || (ch.includes(voter) && !(ae && ae.tagName === "TEXTAREA"))) { render(); window.scrollTo(0, y); }
  else { refreshOthers(); stats(); }
}

/* ---------- cabeçalho ---------- */
function paintVoters(){
  const box = $("voters"); box.innerHTML = "";
  VOTERS.forEach(([id,name])=>{
    const b = document.createElement("button");
    b.textContent = name; b.setAttribute("aria-pressed", String(mode==="vote" && voter===id));
    b.onclick = ()=>{ mode="vote"; voter=id; try{localStorage.setItem(LS_VOTER,id);}catch(e){} paintVoters(); render(); };
    box.appendChild(b);
  });
  const c = document.createElement("button");
  c.textContent = "Comparar"; c.setAttribute("aria-pressed", String(mode==="compare"));
  c.onclick = ()=>{ mode="compare"; try{localStorage.setItem(LS_VOTER,"compare");}catch(e){} paintVoters(); render(); };
  box.appendChild(c);
}
const who = $("who2") || document.createElement("select");
function stats(){
  const p = DATA.people[cur];
  const sm = $("statmain"), chg = $("chg"), fill = $("fill");
  if (mode === "compare") {
    const parts = VOTERS.map(([id,name])=> name + " " + getAns(id,p).filter(x=>x).length + "/36");
    const a = VOTERS.map(([id])=>getAns(id,p));
    let div = 0;
    for (let i=0;i<36;i++){ const set = new Set(a.map(x=>x[i]).filter(Boolean)); if (set.size>1) div++; }
    sm.textContent = parts.join(" · ");
    chg.textContent = div ? div + (div===1?" divergência":" divergências") : "";
    fill.style.width = "0%";
    return;
  }
  if (!voter) { sm.textContent = ""; chg.textContent=""; fill.style.width="0%"; return; }
  const a = getAns(voter,p);
  const done = a.filter(x=>x).length;
  sm.innerHTML = "<b>" + done + "</b> de 36 respondidas";
  fill.style.width = (done/36*100) + "%";
  if (voter === "thiago") {
    const s = sugg(p); const n = a.filter((x,i)=>x!==s[i]).length;
    chg.textContent = n ? n + (n===1?" alterada":" alteradas") + " em relação à sugestão" : "";
  } else chg.textContent = "";
}

/* ---------- análises ---------- */
function anaBlocks(p, editable){
  const wrap = document.createElement("div");
  VOTERS.forEach(([id,name,de])=>{
    const box = document.createElement("div"); box.className="ana";
    const h = document.createElement("h3"); h.textContent = "Análise " + de; box.appendChild(h);
    if (editable && voter === id) {
      const ta = document.createElement("textarea");
      ta.value = getAna(id,p);
      ta.placeholder = "Escreva sua análise sobre " + p.nome + "…";
      ta.setAttribute("aria-label","Análise " + de);
      ta.disabled = !canWrite;
      ta.addEventListener("input", ()=>{ putAna(id,p,ta.value); scheduleSave(id); });
      box.appendChild(ta);
    } else {
      const d = document.createElement("div"); d.className = "ro"; d.dataset.voter = id;
      const t = getAna(id,p);
      d.textContent = t || "Ainda sem análise."; if (!t) d.classList.add("none");
      box.appendChild(d);
    }
    wrap.appendChild(box);
  });
  return wrap;
}
function refreshOthers(){
  const p = DATA.people[cur];
  document.querySelectorAll(".ana .ro").forEach(d=>{
    const t = getAna(d.dataset.voter, p);
    d.textContent = t || "Ainda sem análise."; d.classList.toggle("none", !t);
  });
}

/* ---------- votação ---------- */
function paintRow(row, p, idx){
  const a = getAns(voter,p)[idx], s = sugg(p)[idx];
  const changed = voter === "thiago" && a !== s;
  row.classList.toggle("changed", changed);
  row.querySelectorAll(".opt").forEach(l=>{
    const on = l.dataset.code === a;
    l.classList.toggle("on", on); l.querySelector("input").checked = on;
  });
  const m = row.querySelector(".mark");
  m.textContent = changed ? "Alterada. Sugestão: " + label(s) : "";
}
function setAnswer(p, idx, code){
  const arr = getAns(voter,p);
  arr[idx] = arr[idx] === code ? "" : code;
  putAns(voter,p,arr); scheduleSave(voter);
  paintRow(document.querySelector('[data-idx="'+idx+'"]'), p, idx);
  stats();
}

function buildSections(p, main){
  const cmp = mode === "compare";
  const all = cmp ? VOTERS.map(([id])=>getAns(id,p)) : null;
  DATA.valores.forEach((val,vi)=>{
    const sec = document.createElement("section"); sec.className="val";
    const h2 = document.createElement("h2"); h2.textContent = val.nome; sec.appendChild(h2);
    const mk = (title, cls, qs, off) => {
      const g = document.createElement("div"); g.className="grp "+cls; g.textContent=title; sec.appendChild(g);
      qs.forEach((q,qi)=>{
        const idx = vi*6+off+qi;
        const row = document.createElement("div"); row.className="q"; row.dataset.idx = idx;
        row.setAttribute("role","group"); row.setAttribute("aria-label", q);
        const left = document.createElement("div");
        const tx = document.createElement("div"); tx.className="t"; tx.textContent=q;
        const mark = document.createElement("div"); mark.className="mark"; left.append(tx,mark);
        row.appendChild(left);
        if (cmp) {
          const box = document.createElement("div"); box.className="cmp";
          const given = new Set();
          VOTERS.forEach(([id,name],k)=>{
            const c = all[k][idx]; if (c) given.add(c);
            const chip = document.createElement("div"); chip.className = "chip " + (c ? "has" : "empty");
            const a = document.createElement("span"); a.textContent = name;
            const b = document.createElement("span"); b.textContent = c ? label(c) : "—";
            chip.append(a,b); box.appendChild(chip);
          });
          if (given.size > 1) { row.classList.add("div"); const t = document.createElement("div"); t.className="divtag"; t.textContent="Divergência"; left.appendChild(t); }
          row.appendChild(box);
        } else {
          const opts = document.createElement("div"); opts.className="opts";
          OPTS.forEach(([code,lab])=>{
            const l = document.createElement("label"); l.className="opt"; l.dataset.code=code;
            const inp = document.createElement("input"); inp.type="checkbox"; inp.name="q"+idx; inp.disabled = !canWrite;
            inp.addEventListener("change", ()=>setAnswer(p, idx, code));
            l.append(inp, document.createTextNode(lab)); opts.appendChild(l);
          });
          row.appendChild(opts);
        }
        sec.appendChild(row);
        if (!cmp) paintRow(row, p, idx);
      });
    };
    mk("Fraco","f",val.fraco,0);
    mk("Básico","b",val.basico,3);
    if (p.bases[vi]) {
      const b = document.createElement("div"); b.className="base";
      b.innerHTML = "<b>Base no relato (Thiago):</b> "; b.appendChild(document.createTextNode(p.bases[vi]));
      sec.appendChild(b);
    }
    main.appendChild(sec);
  });
}

function render(){
  const p = DATA.people[cur];
  $("who2").value = cur;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === DATA.people.length-1;
  const main = $("main"); main.innerHTML = "";
  if (!ready) { const e = document.createElement("div"); e.className="empty"; e.textContent="Carregando votos…"; main.appendChild(e); stats(); return; }
  if (mode === "vote" && !voter) {
    const w = document.createElement("div"); w.className="welcome";
    w.innerHTML = "<h1>Quem está votando?</h1><p>Escolha seu nome para responder o formulário de valores. Cada líder vota separado. Ao terminar, use \"Salvar meus votos em arquivo\" e envie para o Thiago, que junta tudo na aba Comparar.</p>";
    const seg = document.createElement("div"); seg.className="seg";
    VOTERS.forEach(([id,name])=>{ const b=document.createElement("button"); b.textContent=name; b.onclick=()=>{ voter=id; try{localStorage.setItem(LS_VOTER,id);}catch(e){} paintVoters(); render(); }; seg.appendChild(b); });
    w.appendChild(seg); main.appendChild(w); stats(); return;
  }
  const h = document.createElement("h1"); h.textContent = p.nome; main.appendChild(h);
  if (p.cargo) { const c = document.createElement("p"); c.className="cargo"; c.textContent = p.cargo; main.appendChild(c); }
  if (!canWrite && mode === "vote") { const n = document.createElement("div"); n.className="note"; n.textContent="Você está só com acesso de leitura, então não consegue votar. Peça acesso de Contributor para quem compartilhou a página."; main.appendChild(n); }
  const d = document.createElement("details"); d.className="ctx"; if (mode === "compare") d.open = true;
  const sm = document.createElement("summary"); sm.textContent = "Visão geral e potencial"; d.appendChild(sm);
  d.appendChild(anaBlocks(p, mode === "vote"));
  main.appendChild(d);
  if (mode === "compare") {
    const falta = VOTERS.filter(([id])=> id !== "thiago" && !(state.votes[id].ans && Object.keys(state.votes[id].ans).length)).map(v=>v[1]);
    if (falta.length) { const n = document.createElement("div"); n.className="note"; n.textContent = "Ainda sem votos de " + falta.join(" e ") + " neste navegador. Use \"Carregar votos de um arquivo\" com o arquivo que cada líder enviou."; main.appendChild(n); }
  }
  main.appendChild(fileTools(p));
  if (mode === "vote") {
    const tools = document.createElement("div"); tools.className="tools";
    const b1 = document.createElement("button"); b1.className="btn";
    b1.textContent = voter === "thiago" ? "Restaurar sugestões" : "Limpar respostas desta pessoa";
    const b2 = document.createElement("button"); b2.className="btn"; b2.textContent="Copiar respostas";
    const t = document.createElement("span"); t.className="toast"; t.setAttribute("role","status");
    tools.append(b1,b2,t); main.appendChild(tools);
    b1.disabled = !canWrite;
    b1.onclick = ()=>{
      const o = state.votes[voter];
      if (o.ans) delete o.ans[p.nome]; o._t = Date.now();
      scheduleSave(voter); render();
    };
    b2.onclick = async ()=>{
      const a = getAns(voter,p);
      let txt = p.nome + " (voto " + VOTERS.find(v=>v[0]===voter)[2] + ")\n";
      DATA.valores.forEach((val,vi)=>{
        txt += "\n" + val.nome + "\n";
        val.fraco.forEach((q,i)=>{ txt += "  [Fraco] " + q + " → " + (label(a[vi*6+i])) + "\n"; });
        val.basico.forEach((q,i)=>{ txt += "  [Básico] " + q + " → " + (label(a[vi*6+3+i])) + "\n"; });
      });
      try { await navigator.clipboard.writeText(txt); t.textContent = "Respostas copiadas."; }
      catch(e){ t.textContent = "Não foi possível copiar neste navegador."; }
      setTimeout(()=>{ t.textContent=""; }, 2500);
    };
  }
  if (p.nome.startsWith("Raíssa")) { const e = document.createElement("p"); e.className="cargo"; e.textContent = "Sem contato com a liderança do Thiago no período: as respostas sugeridas dele são Não sei."; main.appendChild(e); }
  buildSections(p, main);
  stats();
  window.scrollTo(0,0);
}

/* ---------- arquivos de votos ---------- */
function fileTools(p){
  const box = document.createElement("div"); box.className = "tools";
  const toast = document.createElement("span"); toast.className = "toast"; toast.setAttribute("role","status");
  const say = t => { toast.textContent = t; setTimeout(()=>{ toast.textContent = ""; }, 4000); };
  if (mode === "vote" && voter) {
    const ex = document.createElement("button"); ex.className = "btn"; ex.textContent = "Salvar meus votos em arquivo";
    ex.onclick = ()=>{
      const out = { app:"avaliacao-valores", v:1, voter, saved: new Date().toISOString(), data: clone(state.votes[voter]) };
      const blob = new Blob([JSON.stringify(out)], { type:"application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "votos-" + voter + ".json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      say("Arquivo gerado. Envie para o Thiago.");
    };
    box.appendChild(ex);
  }
  const im = document.createElement("button"); im.className = "btn"; im.textContent = "Carregar votos de um arquivo";
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json"; inp.hidden = true;
  im.onclick = ()=>inp.click();
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try {
        const o = JSON.parse(r.result);
        if (o.app !== "avaliacao-valores" || !VOTERS.some(v=>v[0]===o.voter) || typeof o.data !== "object") throw 0;
        state.votes[o.voter] = o.data; o.data._t = Date.now(); persistLocal(); pushLater(o.voter);
        const nome = VOTERS.find(v=>v[0]===o.voter)[1];
        render(); const t = document.querySelector(".toast"); if (t) t.textContent = "Votos de " + nome + " carregados.";
      } catch(e) { say("Arquivo inválido. Use um arquivo gerado por esta página."); }
    };
    r.readAsText(f); inp.value = "";
  };
  const pp = document.createElement("button"); pp.className = "btn"; pp.textContent = "PDF desta pessoa";
  pp.onclick = ()=>printReport([agentReport(p)], "Avaliacao-" + slug(p.nome));
  const pg = document.createElement("button"); pg.className = "btn"; pg.textContent = "PDF geral";
  pg.onclick = ()=>printReport([coverReport(), ...DATA.people.map(agentReport)], "Avaliacao-geral");
  box.append(pp, pg, im, inp, toast);
  return box;
}

/* ---------- PDF ---------- */
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function divCount(p){
  const a = VOTERS.map(([id])=>getAns(id,p)); let n = 0;
  for (let i=0;i<36;i++){ if (new Set(a.map(x=>x[i]).filter(Boolean)).size > 1) n++; }
  return n;
}
function agentReport(p){
  const sec = el("section","rp-agent");
  sec.appendChild(el("h1","",p.nome));
  if (p.cargo) sec.appendChild(el("div","rp-sub",p.cargo));
  const all = VOTERS.map(([id])=>getAns(id,p));
  sec.appendChild(el("div","rp-meta", VOTERS.map((v,k)=>v[1] + ": " + all[k].filter(Boolean).length + "/36").join("   |   ") + "   |   " + divCount(p) + " divergência(s)"));
  VOTERS.forEach(([id,name,de])=>{
    sec.appendChild(el("h2","","Análise " + de));
    const t = getAna(id,p);
    sec.appendChild(el("div","rp-ana" + (t ? "" : " none"), t || "Sem análise."));
  });
  DATA.valores.forEach((val,vi)=>{
    const t = el("table"); const thead = el("tr");
    thead.appendChild(el("th","",val.nome)); VOTERS.forEach(([id,name])=>thead.appendChild(el("th","",name)));
    t.appendChild(thead);
    [["Fraco",val.fraco],["Básico",val.basico]].forEach(([g,qs],gi)=>{
      const gr = el("tr","grp"); const gd = el("td","",g); gd.colSpan = 4; gr.appendChild(gd); t.appendChild(gr);
      qs.forEach((q,qi)=>{
        const idx = vi*6 + gi*3 + qi;
        const row = el("tr"); row.appendChild(el("td","",q));
        const given = new Set();
        VOTERS.forEach((v,k)=>{ const c = all[k][idx]; if (c) given.add(c); row.appendChild(el("td", c ? "has" : "", c ? label(c) : "—")); });
        if (given.size > 1) row.classList.add("div");
        t.appendChild(row);
      });
    });
    sec.appendChild(t);
  });
  sec.appendChild(el("div","rp-small","Linhas em verde indicam divergência entre os votos. No grupo Fraco, \"Sim\" significa que o comportamento negativo está presente."));
  return sec;
}
function coverReport(){
  const sec = el("section","rp-agent");
  sec.appendChild(el("h1","","Avaliação por valores: visão geral"));
  sec.appendChild(el("div","rp-sub","Votos de Thiago, Brenda e Jéssica, gerado em " + new Date().toLocaleDateString("pt-BR")));
  const t = el("table"); const th = el("tr");
  ["Colaborador","Thiago","Brenda","Jéssica","Divergências"].forEach(x=>th.appendChild(el("th","",x)));
  t.appendChild(th);
  DATA.people.forEach(p=>{
    const r = el("tr"); r.appendChild(el("td","",p.nome));
    VOTERS.forEach(([id])=> r.appendChild(el("td","num", getAns(id,p).filter(Boolean).length + "/36")));
    const n = divCount(p); r.appendChild(el("td","num", String(n))); if (n) r.classList.add("div");
    t.appendChild(r);
  });
  sec.appendChild(t);
  sec.appendChild(el("div","rp-small","Cada pessoa tem uma página com as análises dos três líderes e todas as respostas lado a lado."));
  return sec;
}
function slug(t){ return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function printReport(nodes, title){
  const r = $("report"); r.innerHTML = ""; nodes.forEach(n=>r.appendChild(n));
  const old = document.title; document.title = title;
  document.body.classList.add("printing");
  const done = ()=>{ document.body.classList.remove("printing"); document.title = old; r.innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(()=>window.print(), 80);
}

/* ---------- navegação ---------- */
function start(){
  DATA.people.forEach((p,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=p.nome; $("who2").appendChild(o); });
  $("who2").onchange = ()=>{ cur = +$("who2").value; render(); };
  $("prev").onclick = ()=>{ if(cur>0){ cur--; render(); } };
  $("next").onclick = ()=>{ if(cur<DATA.people.length-1){ cur++; render(); } };
  try { const o = JSON.parse(localStorage.getItem(LS_VOTES) || "{}"); VOTERS.forEach(([id])=>{ if (o[id]) state.votes[id] = o[id]; }); } catch(e){}
  document.body.classList.remove("locked");
  if (!SYNC) { ready = true; setSync("Os votos ficam salvos neste navegador"); paintVoters(); render(); return; }
  ready = false; paintVoters(); render(); setSync("Conectando ao servidor de votos…");
  votesKey(PASS).then(async k => {
    VKEY = k;
    await Promise.race([pullAll(), new Promise(r=>setTimeout(r, 15000))]);
    ready = true; paintVoters(); render();
    setInterval(async ()=>{ afterRemote(await pullAll()); }, 20000);
    document.addEventListener("visibilitychange", async ()=>{ if (!document.hidden) afterRemote(await pullAll()); });
  });
}

/* ---------- senha ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function tryOpen(pass, fromForm){
  const err = $("gerr"); err.textContent = "";
  try { DATA = await unlock(pass); PASS = pass; try { sessionStorage.setItem("aval-pass", pass); } catch(e){} $("gate").remove(); start(); }
  catch(e){ if (fromForm) err.textContent = "Senha incorreta. Confira com o Thiago."; }
}
$("gform").addEventListener("submit", ev=>{ ev.preventDefault(); tryOpen($("gpass").value.trim(), true); });
(function(){ let p = null; try { p = sessionStorage.getItem("aval-pass"); } catch(e){} if (p) tryOpen(p, false); })();
</script>
